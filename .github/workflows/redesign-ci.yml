name: Redesign CI

on:
  push:
    branches:
      - redesign-v2
  pull_request:
    branches:
      - main
      - redesign-v2

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JOINHOOK_DEPLOY_TARGET: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit all dependencies
        run: npm audit --audit-level=high
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npx eslint .
      - name: Build
        run: npm run build
      - name: Check client JavaScript budget
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip
          files = list(Path('.next/static').rglob('*.js'))
          total = sum(len(gzip.compress(path.read_bytes(), compresslevel=9)) for path in files)
          limit = 1_500_000
          print(f'Client JS gzip total: {total / 1024:.1f} KiB across {len(files)} files')
          if total > limit: raise SystemExit('Client JavaScript budget exceeded')
          PY
      - name: Validate PWA manifest and offline shell
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import parse_qs, urlparse
          manifest = json.loads(Path('public/cge-manifest.webmanifest').read_text(encoding='utf-8'))
          start = urlparse(manifest['start_url'])
          assert manifest['id'] == '/app/control-gastronomico-express'
          assert start.path == '/app/control-gastronomico-express'
          assert parse_qs(start.query).get('source') == ['pwa']
          assert manifest['scope'] == '/app/'
          assert manifest['display'] == 'standalone'
          sizes = {icon.get('sizes') for icon in manifest.get('icons', [])}
          assert {'192x192', '512x512'} <= sizes
          sw = Path('public/app/cge-sw.js').read_text(encoding='utf-8')
          for asset in ['/app/control-gastronomico-express','/cge-manifest.webmanifest','/icons/cge-icon.svg','/icons/cge-icon-192.png','/icons/cge-icon-512.png','/plantillas/control-gastronomico-inventario.csv']:
              assert asset in sw, f'Missing offline shell asset: {asset}'
          PY
      - name: Start app for smoke tests
        run: |
          npm run start -- -p 3000 > /tmp/joinhook-next.log 2>&1 & echo $! > /tmp/joinhook-next.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0 || true; sleep 1; done
          cat /tmp/joinhook-next.log; exit 1
      - name: Smoke test public routes and PWA assets
        run: |
          for url in / /herramientas/control-gastronomico-express /app/control-gastronomico-express /privacidad /condiciones-beta /robots.txt /sitemap.xml /cge-manifest.webmanifest /app/cge-sw.js /icons/cge-icon.svg /icons/cge-icon-192.png /icons/cge-icon-512.png /plantillas/control-gastronomico-inventario.csv; do curl --fail --silent --show-error --output /dev/null "http://127.0.0.1:3000${url}"; done
          for path in info blog projects blog/post-one projects/project-one; do code=$(curl --location --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:3000/$path"); test "$code" = 404 || exit 1; done
      - name: Verify baseline security headers
        run: |
          curl --fail --silent --show-error --dump-header /tmp/headers.txt --output /dev/null http://127.0.0.1:3000/
          grep -qi '^content-security-policy:' /tmp/headers.txt && grep -qi "default-src 'self'" /tmp/headers.txt && grep -qi "object-src 'none'" /tmp/headers.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/headers.txt
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' /tmp/headers.txt
          grep -qi '^x-frame-options: SAMEORIGIN' /tmp/headers.txt
          grep -qi '^permissions-policy:' /tmp/headers.txt
          grep -qi '^x-robots-tag: noindex, nofollow, noarchive' /tmp/headers.txt
          ! grep -qi '^x-powered-by:' /tmp/headers.txt
      - name: Prepare BlueHosting standalone artifact
        run: |
          rm -rf deploy-bluehosting
          mkdir -p deploy-bluehosting/.next
          cp -a .next/standalone/. deploy-bluehosting/
          cp -a .next/static deploy-bluehosting/.next/static
          cp -a public deploy-bluehosting/public
          # Apache document-root mirror: copy its CONTENT into /home/joinhook/public_html.
          mkdir -p deploy-bluehosting/document-root-assets/_next
          cp -a .next/static deploy-bluehosting/document-root-assets/_next/static
          cp -a public/. deploy-bluehosting/document-root-assets/
          cat > deploy-bluehosting/DEPLOYMENT.txt <<EOF
          JoinHook V2 + CGE Beta 0.3
          Source commit: $GITHUB_SHA
          Built by: GitHub Actions / Redesign CI
          Runtime: Node.js 20.20.2
          Deploy target: staging
          Target: BlueHosting Passenger staging-joinhook
          Startup file: server.js
          Apache document root mirror: document-root-assets/
          Copy the CONTENT of document-root-assets/ into /home/joinhook/public_html.
          Do not run next build on BlueHosting.
          EOF
          test -f deploy-bluehosting/server.js
          test -f deploy-bluehosting/package.json
          test -d deploy-bluehosting/node_modules
          test -d deploy-bluehosting/.next/static
          test -f deploy-bluehosting/public/cge-manifest.webmanifest
          test -d deploy-bluehosting/document-root-assets/_next/static
          test -f deploy-bluehosting/document-root-assets/cge-manifest.webmanifest
          test -f deploy-bluehosting/document-root-assets/icons/cge-icon-192.png
          test -f deploy-bluehosting/document-root-assets/icons/cge-icon-512.png
          test ! -d deploy-bluehosting/document-root-assets/_next/static/static
      - name: Smoke test standalone artifact
        run: |
          PORT=3010 HOSTNAME=127.0.0.1 NODE_ENV=production node deploy-bluehosting/server.js > /tmp/joinhook-standalone.log 2>&1 & echo $! > /tmp/joinhook-standalone.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:3010/ >/dev/null && break || true; sleep 1; done
          curl --fail --silent --show-error http://127.0.0.1:3010/herramientas/control-gastronomico-express >/tmp/cge-standalone.html
          grep -Fq 'Solicitar pack fundador' /tmp/cge-standalone.html
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3010/app/control-gastronomico-express
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3010/cge-manifest.webmanifest
          curl --fail --silent --show-error --dump-header /tmp/standalone-headers.txt --output /dev/null http://127.0.0.1:3010/
          grep -qi '^content-security-policy:' /tmp/standalone-headers.txt
          grep -qi '^x-robots-tag: noindex, nofollow, noarchive' /tmp/standalone-headers.txt
      - name: Stop standalone artifact
        if: always()
        run: test ! -f /tmp/joinhook-standalone.pid || kill "$(cat /tmp/joinhook-standalone.pid)" || true
      - name: Upload BlueHosting deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: joinhook-bluehosting-standalone
          path: deploy-bluehosting
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Stop app
        if: always()
        run: test ! -f /tmp/joinhook-next.pid || kill "$(cat /tmp/joinhook-next.pid)" || true

  commercial-checkout:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CGE_CHECKOUT_ENABLED: 'true'
      NEXT_PUBLIC_CGE_CHECKOUT_URL: 'https://example.com/cge-qa-checkout'
      NEXT_PUBLIC_SELLER_NAME: 'Proveedor QA JoinHook'
      NEXT_PUBLIC_SELLER_RUT: '00.000.000-0'
      NEXT_PUBLIC_SELLER_EMAIL: 'qa@example.com'
      NEXT_PUBLIC_SELLER_ADDRESS: 'Dirección QA no comercial'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build with checkout enabled using QA-only public data
        run: npm run build
      - name: Start QA commercial build
        run: |
          npm run start -- -p 3001 > /tmp/joinhook-commercial.log 2>&1 & echo $! > /tmp/joinhook-commercial.pid
          for i in {1..30}; do curl --location -fsS http://127.0.0.1:3001/herramientas/control-gastronomico-express >/tmp/cge-commercial.html && exit 0 || true; sleep 1; done
          cat /tmp/joinhook-commercial.log; exit 1
      - name: Verify enabled checkout state
        run: |
          for pattern in 'Comprar pack fundador' 'Proveedor QA JoinHook' 'cge-qa-checkout'; do grep -Fq "$pattern" /tmp/cge-commercial.html || exit 1; done
          ! grep -Fq 'Solicitar pack fundador' /tmp/cge-commercial.html
      - name: Stop QA commercial build
        if: always()
        run: test ! -f /tmp/joinhook-commercial.pid || kill "$(cat /tmp/joinhook-commercial.pid)" || true

  browser-qa:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Install Playwright API for QA only
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Resolve preinstalled Chromium
        run: |
          CHROME_BIN="$(command -v chromium || command -v google-chrome || command -v google-chrome-stable)"; test -n "$CHROME_BIN"; echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"; "$CHROME_BIN" --version
      - name: Start browser QA server
        run: |
          npm run start -- -p 3002 > /tmp/joinhook-browser.log 2>&1 & echo $! > /tmp/joinhook-browser.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:3002/ >/dev/null && exit 0 || true; sleep 1; done
          cat /tmp/joinhook-browser.log; exit 1
      - name: Run Chromium end-to-end QA
        env:
          BROWSER_QA_BASE_URL: http://127.0.0.1:3002
        run: node scripts/browser-qa.cjs
      - name: Upload browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joinhook-browser-qa
          path: artifacts/browser-qa
          if-no-files-found: warn
          retention-days: 7
      - name: Stop browser QA server
        if: always()
        run: test ! -f /tmp/joinhook-browser.pid || kill "$(cat /tmp/joinhook-browser.pid)" || true
