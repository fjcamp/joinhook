name: Fix dev audit without force

on:
  push:
    branches:
      - security/remove-stackbit-legacy

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/remove-stackbit-legacy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm

      - name: Install exact tree
        run: npm ci

      - name: Apply non-breaking audit fixes
        run: npm audit fix

      - name: Verify full audit
        run: npm audit --audit-level=high

      - name: Commit dependency fixes
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(security): apply non-breaking npm audit fixes [skip ci]"
          git push origin HEAD:security/remove-stackbit-legacy
