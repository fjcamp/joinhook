name: Commerce Security CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/lib/commerce/**'
      - 'src/pages/api/commerce/**'
      - 'src/pages/checkout/**'
      - 'src/pages/mi-compra.tsx'
      - 'src/pages/recuperar-compra.tsx'
      - 'docs/commerce/**'
      - '.env.commerce.example'
      - 'scripts/verify-commerce-security.mjs'
      - '.github/workflows/commerce-security-ci.yml'

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2

      - name: Verify Commerce security invariants
        run: node scripts/verify-commerce-security.mjs
