name: Fix home accessibility semantics

on:
  push:
    branches:
      - release/staging-hardening

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/staging-hardening

      - name: Fix project deck semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/index.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace('className="jh-project-deck" role="list" aria-label="Proyectos JoinHook"', 'className="jh-project-deck" aria-label="Proyectos JoinHook"')
          text = text.replace('                                        role="listitem"\n', '')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          if git diff --quiet -- src/pages/index.tsx; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/index.tsx
          git commit -m "fix(a11y): corregir semántica de tarjetas de proyecto [skip ci]"
          git push origin HEAD:release/staging-hardening
