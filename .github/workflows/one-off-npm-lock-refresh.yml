name: One-off npm lock refresh

on:
  push:
    branches:
      - feature/prelaunch-content-positioning-2026-10-06

permissions:
  contents: write

jobs:
  refresh:
    if: startsWith(github.event.head_commit.message, 'chore: refresh npm lock')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: npm
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit refreshed lockfile and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-off-npm-lock-refresh.yml
          git rm -f LOCK_REFRESH_TRIGGER.txt
          git add package-lock.json
          git commit -m "chore: refresh npm lock"
          git push
