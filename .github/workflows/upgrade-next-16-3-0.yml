name: Upgrade Next 16.3.0

on:
  pull_request:
    branches:
      - redesign-v2

permissions:
  contents: write

jobs:
  upgrade:
    if: github.head_ref == 'security/next-15-5-21' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: security/next-15-5-21

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm

      - name: Upgrade to stable Next.js 16.3.0
        run: |
          npm install next@16.3.0 eslint-config-next@16.3.0 react@latest react-dom@latest --save-exact
          npm audit fix

      - name: Commit generated package lock
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(security): upgrade to Next.js 16.3.0 [skip ci]"
          git push origin HEAD:security/next-15-5-21
