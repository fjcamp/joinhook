name: EGO CI Scheduler Probe

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduler-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report scheduler context
        run: |
          echo "workflow=$"+"{GITHUB_WORKFLOW}"
          echo "event=$"+"{GITHUB_EVENT_NAME}"
          echo "ref=$"+"{GITHUB_REF}"
          echo "sha=$"+"{GITHUB_SHA}"
          echo "repository=$"+"{GITHUB_REPOSITORY}"
