name: Production Artifact

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npx eslint .

      - name: Build production
        env:
          NODE_ENV: production
        run: npm run build

      - name: Start production build
        run: |
          npm run start -- -p 3000 > /tmp/joinhook-production.log 2>&1 &
          echo $! > /tmp/joinhook-production.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/joinhook-production.log
          exit 1

      - name: Verify production routes and indexing
        run: |
          curl --fail --silent --show-error --dump-header /tmp/production-headers.txt --output /dev/null http://127.0.0.1:3000/
          grep -qi '^content-security-policy:' /tmp/production-headers.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/production-headers.txt
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' /tmp/production-headers.txt
          grep -qi '^x-frame-options: SAMEORIGIN' /tmp/production-headers.txt
          grep -qi '^permissions-policy:' /tmp/production-headers.txt
          if grep -qi '^x-robots-tag:' /tmp/production-headers.txt; then
            echo 'Production must not include staging X-Robots-Tag'
            cat /tmp/production-headers.txt
            exit 1
          fi
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/robots.txt
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/sitemap.xml
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/herramientas/control-gastronomico-express
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/app/control-gastronomico-express
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/privacidad
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/condiciones-beta

      - name: Prepare production standalone artifact
        run: |
          rm -rf deploy-production
          mkdir -p deploy-production/.next
          cp -a .next/standalone/. deploy-production/
          cp -a .next/static deploy-production/.next/static
          cp -a public deploy-production/public
          cat > deploy-production/DEPLOYMENT.txt <<EOF
          JoinHook V2 + CGE Beta 0.3
          Source commit: $GITHUB_SHA
          Built by: GitHub Actions / Production Artifact
          Runtime: Node.js 20.20.2
          Deploy target: production
          Search indexing: enabled (no staging X-Robots-Tag)
          Target: BlueHosting Passenger joinhook.cl
          Startup file: server.js
          Do not run next build on BlueHosting.
          EOF
          test -f deploy-production/server.js
          test -f deploy-production/package.json
          test -d deploy-production/node_modules
          test -d deploy-production/.next/static
          test -f deploy-production/public/favicon.svg
          test -f deploy-production/public/cge-manifest.webmanifest

      - name: Smoke test standalone production artifact
        run: |
          PORT=3010 HOSTNAME=127.0.0.1 NODE_ENV=production node deploy-production/server.js > /tmp/joinhook-production-standalone.log 2>&1 &
          echo $! > /tmp/joinhook-production-standalone.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3010/ > /dev/null; then
              break
            fi
            if [ "$i" = 30 ]; then
              cat /tmp/joinhook-production-standalone.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error --dump-header /tmp/standalone-production-headers.txt --output /dev/null http://127.0.0.1:3010/
          grep -qi '^content-security-policy:' /tmp/standalone-production-headers.txt
          if grep -qi '^x-robots-tag:' /tmp/standalone-production-headers.txt; then
            echo 'Standalone production artifact contains staging noindex header'
            exit 1
          fi
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3010/app/control-gastronomico-express
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3010/cge-manifest.webmanifest

      - name: Stop servers
        if: always()
        run: |
          if [ -f /tmp/joinhook-production.pid ]; then kill "$(cat /tmp/joinhook-production.pid)" || true; fi
          if [ -f /tmp/joinhook-production-standalone.pid ]; then kill "$(cat /tmp/joinhook-production-standalone.pid)" || true; fi

      - name: Upload production artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: joinhook-bluehosting-production
          path: deploy-production
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Report production artifact to Launch Gate
        uses: actions/github-script@v8
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const marker = '<!-- joinhook-production-artifact -->';
            const body = `${marker}\n## Production artifact ready\n\n- Commit: \`${context.sha}\`\n- Artifact: \`joinhook-bluehosting-production\`\n- Artifact ID: \`${process.env.ARTIFACT_ID}\`\n- Digest: \`${process.env.ARTIFACT_DIGEST}\`\n- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n- Artifact URL: ${process.env.ARTIFACT_URL}\n- Production build verified without staging \`X-Robots-Tag\`.\n`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 13,
              per_page: 100
            });
            const previous = comments.find(comment => comment.body && comment.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 13,
                body
              });
            }
