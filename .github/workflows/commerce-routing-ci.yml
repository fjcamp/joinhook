name: Commerce Routing CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/pages/herramientas/control-gastronomico-express.tsx'
      - 'src/pages/checkout/control-gastronomico-express.tsx'
      - 'src/pages/api/commerce/**'
      - 'src/lib/commerce/**'
      - '.github/workflows/commerce-routing-ci.yml'

permissions:
  contents: read

jobs:
  embedded-routing:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_JOINHOOK_COMMERCE_ENABLED: 'true'
      NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY: 'TEST-QA-PUBLIC-KEY'
      JOINHOOK_COMMERCE_ACCEPT_PAYMENTS: 'false'
      JOINHOOK_COMMERCE_ENV: 'test'
      NEXT_PUBLIC_CONTROL_EXPRESS_CHECKOUT_ENABLED: 'true'
      NEXT_PUBLIC_CONTROL_EXPRESS_CHECKOUT_URL: 'https://example.com/legacy-fallback'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build embedded Commerce variant
        run: npm run build

      - name: Start QA server
        run: |
          npm run start -- -p 3011 > /tmp/joinhook-commerce-routing.log 2>&1 &
          echo $! > /tmp/joinhook-commerce-routing.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3011/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/joinhook-commerce-routing.log
          exit 1

      - name: Verify landing prefers embedded JoinHook checkout
        run: |
          curl --location --fail --silent --show-error http://127.0.0.1:3011/herramientas/control-gastronomico-express > /tmp/control-express.html
          grep -Fq '/checkout/control-gastronomico-express' /tmp/control-express.html
          grep -Fq 'El pago se realiza dentro de JoinHook mediante Mercado Pago' /tmp/control-express.html
          if grep -Fq 'https://example.com/legacy-fallback' /tmp/control-express.html; then
            echo 'Embedded Commerce must take precedence over the legacy fallback checkout URL'
            exit 1
          fi

      - name: Verify embedded checkout page renders
        run: |
          curl --location --fail --silent --show-error http://127.0.0.1:3011/checkout/control-gastronomico-express > /tmp/embedded-checkout.html
          grep -Fq 'Checkout JoinHook · Mercado Pago' /tmp/embedded-checkout.html
          grep -Fq 'Control Gastronómico Express' /tmp/embedded-checkout.html

      - name: Verify server-side payment kill switch
        run: |
          code=$(curl --silent --output /tmp/create-order.json --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            http://127.0.0.1:3011/api/commerce/create-order)
          if [ "$code" != "503" ]; then
            echo "Expected 503 while JOINHOOK_COMMERCE_ACCEPT_PAYMENTS=false, got $code"
            cat /tmp/create-order.json
            exit 1
          fi
          grep -Fq 'commerce_payments_disabled' /tmp/create-order.json

      - name: Stop QA server
        if: always()
        run: |
          if [ -f /tmp/joinhook-commerce-routing.pid ]; then
            kill "$(cat /tmp/joinhook-commerce-routing.pid)" || true
          fi
