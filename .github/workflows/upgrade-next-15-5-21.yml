name: Upgrade Next 15.5.21

on:
  push:
    branches:
      - security/next-15-5-21

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: security/next-15-5-21

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refresh patched runtime dependencies
        run: |
          npm uninstall front-matter
          npm install next@15.5.21 eslint-config-next@15.5.21 js-yaml@5.2.2 react-syntax-highlighter@16.1.1 --save-exact

      - name: Commit generated package lock
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(security): refresh patched runtime dependencies [skip ci]"
          git push origin HEAD:security/next-15-5-21
