name: Temporary Lockfile Regeneration

on:
  push:
    branches:
      - feat/joinhook-web-v1

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2

      - name: Regenerate lockfile
        run: npm install --package-lock-only

      - name: Commit lockfile when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- package-lock.json; then
            echo 'No lockfile changes required.'
            exit 0
          fi
          git add package-lock.json
          git commit -m 'chore: regenerate lockfile for patched dependencies'
          git push origin HEAD:feat/joinhook-web-v1
