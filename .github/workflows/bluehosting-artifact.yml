name: BlueHosting Deploy Artifact

on:
  workflow_dispatch:
  push:
    branches:
      - redesign-v2

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standalone
        run: npm run build

      - name: Assemble BlueHosting package
        shell: bash
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js
          mkdir -p deploy/.next
          cp -a .next/standalone/. deploy/
          cp -a .next/static deploy/.next/static
          cp -a public deploy/public
          printf '%s\n' '# Passenger restart marker' > deploy/README-DEPLOY.txt
          tar -C deploy -czf joinhook-bluehosting-standalone.tar.gz .

      - name: Upload BlueHosting artifact
        uses: actions/upload-artifact@v4
        with:
          name: joinhook-bluehosting-standalone
          path: joinhook-bluehosting-standalone.tar.gz
          if-no-files-found: error
          retention-days: 7
