name: Secret History Scan

on:
  push:
    branches:
      - redesign-v2
  pull_request:
    branches:
      - main
      - redesign-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan Git history for common secret families
        shell: bash
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys

          patterns = {
              "GitHub token": rb"gh[pousr]_[A-Za-z0-9]{36,}",
              "OpenAI API key": rb"sk-(?:proj-)?[A-Za-z0-9_-]{20,}",
              "AWS access key": rb"AKIA[0-9A-Z]{16}",
              "Google API key": rb"AIza[0-9A-Za-z_-]{35}",
              "Stripe secret key": rb"sk_(?:live|test)_[0-9A-Za-z]{16,}",
              "Slack token": rb"xox[baprs]-[0-9A-Za-z-]{10,}",
              "npm token": rb"npm_[A-Za-z0-9]{36,}",
              "Private key": rb"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----",
          }

          history = subprocess.run(
              ["git", "log", "-p", "--all", "--full-history", "--no-ext-diff", "--no-color"],
              check=True,
              stdout=subprocess.PIPE,
          ).stdout

          findings = []
          for label, pattern in patterns.items():
              if re.search(pattern, history):
                  findings.append(label)

          names = subprocess.run(
              ["git", "log", "--all", "--name-only", "--pretty=format:"],
              check=True,
              stdout=subprocess.PIPE,
              text=True,
          ).stdout.splitlines()

          sensitive_names = []
          allowed_env_suffixes = (".example", ".sample", ".template")
          for raw in names:
              path = raw.strip()
              if not path:
                  continue
              lower = path.lower()
              basename = lower.rsplit("/", 1)[-1]

              env_like = basename == ".env" or basename.startswith(".env.")
              if env_like and not basename.endswith(allowed_env_suffixes):
                  sensitive_names.append(path)
                  continue

              if basename in {"id_rsa", "id_ed25519", "secrets.json", "service-account.json"}:
                  sensitive_names.append(path)
                  continue

              if basename.endswith((".p12", ".pfx")):
                  sensitive_names.append(path)

          sensitive_names = sorted(set(sensitive_names))

          if findings or sensitive_names:
              print("Historical secret scan FAILED.")
              if findings:
                  print("Potential credential families detected (values intentionally not printed):")
                  for finding in findings:
                      print(f"- {finding}")
              if sensitive_names:
                  print("Potentially sensitive filenames found in Git history:")
                  for path in sensitive_names[:50]:
                      print(f"- {path}")
                  if len(sensitive_names) > 50:
                      print(f"- ... and {len(sensitive_names) - 50} more")
              print("Review and rotate/rewrite history if any finding is real before production.")
              sys.exit(1)

          print("Historical secret scan passed: no supported credential patterns or sensitive filenames detected.")
          PY
