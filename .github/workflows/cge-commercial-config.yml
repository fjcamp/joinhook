name: Prepare CGE commercial configuration

on:
  push:
    branches:
      - release/checkout-ready

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/checkout-ready

      - name: Make checkout safely configurable
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/herramientas/control-gastronomico-express.tsx')
          text = path.read_text(encoding='utf-8')

          marker = "const purchaseMail = 'mailto:info@joinhook.cl?subject=Quiero%20comprar%20Control%20Gastron%C3%B3mico%20Express&body=Hola%20Francisco%2C%0A%0AQuiero%20solicitar%20el%20acceso%20de%20lanzamiento%20a%20Control%20Gastron%C3%B3mico%20Express%20por%20%244.990%20CLP.%0A%0AMi%20negocio%20es%3A%20%0ACiudad%3A%20%0A%0AGracias.';"
          replacement = """const purchaseMail = 'mailto:info@joinhook.cl?subject=Quiero%20el%20pack%20fundador%20de%20Control%20Gastron%C3%B3mico%20Express&body=Hola%20Francisco%2C%0A%0AMe%20interesa%20el%20pack%20fundador%20de%20Control%20Gastron%C3%B3mico%20Express%20por%20%244.990%20CLP.%0A%0AMi%20negocio%20es%3A%20%0ACiudad%3A%20%0AGracias.';
const checkoutUrl = process.env.NEXT_PUBLIC_CGE_CHECKOUT_URL?.trim();
const seller = {
    name: process.env.NEXT_PUBLIC_SELLER_NAME?.trim(),
    rut: process.env.NEXT_PUBLIC_SELLER_RUT?.trim(),
    email: process.env.NEXT_PUBLIC_SELLER_EMAIL?.trim(),
    address: process.env.NEXT_PUBLIC_SELLER_ADDRESS?.trim()
};
const sellerReady = Boolean(seller.name && seller.rut && seller.email && seller.address);
const checkoutEnabled = process.env.NEXT_PUBLIC_CGE_CHECKOUT_ENABLED === 'true' && sellerReady && Boolean(checkoutUrl?.startsWith('https://'));
const purchaseHref = checkoutEnabled ? checkoutUrl! : purchaseMail;"""
          if marker not in text:
              raise SystemExit('purchaseMail marker not found')
          text = text.replace(marker, replacement, 1)

          replacements = {
              '<span className="jh-eyebrow">Oferta de lanzamiento</span>': '<span className="jh-eyebrow">Pack fundador · lanzamiento</span>',
              '<p>Acceso de lanzamiento a las funciones incluidas en esta versión. Sin mensualidad para este alcance inicial.</p>': '<p>La beta se puede probar gratis. El pack fundador reserva tu acceso a la versión de lanzamiento e incluye acompañamiento inicial, sin mensualidad para este alcance.</p>',
              '<li>Uso en navegador y PWA compatible</li>\n                                <li>Inventario, compras, mermas y proveedores</li>\n                                <li>Importación/exportación y respaldo local</li>\n                                <li>Actualizaciones correctivas de la beta</li>\n                                <li>Soporte inicial por correo</li>': '<li>Prueba beta abierta antes de decidir</li>\n                                <li>Pack fundador para la versión de lanzamiento</li>\n                                <li>Inventario, compras, mermas y proveedores</li>\n                                <li>Plantilla CSV, respaldo local y guía de puesta en marcha</li>\n                                <li>Actualizaciones correctivas de esta versión y soporte inicial</li>',
              '<a className="jh-button jh-button-primary" href={purchaseMail}>Solicitar compra por $4.990</a>': '<a className="jh-button jh-button-primary" href={purchaseHref} target={checkoutEnabled ? \'_blank\' : undefined} rel={checkoutEnabled ? \'noreferrer\' : undefined}>{checkoutEnabled ? \'Comprar pack fundador · $4.990\' : \'Solicitar pack fundador · $4.990\'}</a>',
              '<small className="jh-purchase-note">La solicitud abre tu correo y no realiza un cobro automático. El checkout se habilitará después de completar la configuración comercial y legal del lanzamiento.</small>': '<small className="jh-purchase-note">{checkoutEnabled ? \'El cobro se abre en el proveedor de pago configurado. Antes de pagar, revisa las condiciones de beta y los datos del vendedor que aparecen aquí.\' : \'La solicitud abre tu correo y no realiza un cobro automático. El checkout permanecerá deshabilitado hasta configurar medio de pago y datos públicos del vendedor.\'}</small>\n                            {sellerReady && <small className="jh-purchase-note"><strong>Proveedor:</strong> {seller.name} · RUT {seller.rut} · {seller.email} · {seller.address}</small>}',
              '<a className="jh-button jh-button-soft" href={purchaseMail}>Solicitar compra</a>': '<a className="jh-button jh-button-soft" href={purchaseHref} target={checkoutEnabled ? \'_blank\' : undefined} rel={checkoutEnabled ? \'noreferrer\' : undefined}>{checkoutEnabled ? \'Comprar pack fundador\' : \'Solicitar pack fundador\'}</a>'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'marker not found: {old[:80]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          cat > docs/cge-checkout-config.md <<'EOF'
          # Control Gastronómico Express — activación de checkout

          El checkout se mantiene deshabilitado por defecto. La landing usa solicitud por correo hasta que estén presentes **todos** los datos comerciales necesarios.

          Variables públicas de Netlify requeridas para habilitar cobro:

          - `NEXT_PUBLIC_CGE_CHECKOUT_ENABLED=true`
          - `NEXT_PUBLIC_CGE_CHECKOUT_URL=https://...` — enlace de pago específico de CGE.
          - `NEXT_PUBLIC_SELLER_NAME=...` — nombre/razón social que corresponda al vendedor.
          - `NEXT_PUBLIC_SELLER_RUT=...`
          - `NEXT_PUBLIC_SELLER_EMAIL=...`
          - `NEXT_PUBLIC_SELLER_ADDRESS=...`

          Reglas:

          1. No activar `NEXT_PUBLIC_CGE_CHECKOUT_ENABLED` hasta verificar los datos del vendedor y las condiciones electrónicas.
          2. El enlace de pago debe ser específico de Control Gastronómico Express y usar HTTPS.
          3. Estas variables son `NEXT_PUBLIC_*`: se muestran al navegador y **no deben contener secretos, tokens ni claves privadas**.
          4. Las credenciales reales de un proveedor de pagos, si en el futuro se integra una API/webhook, deberán permanecer server-side y nunca usar prefijo `NEXT_PUBLIC_`.
          5. Tras cambiar variables de build en Netlify, realizar un nuevo deploy y comprobar landing, condiciones y comprobante/confirmación de compra.

          Con checkout incompleto o deshabilitado, la landing sigue siendo usable para probar la beta y solicitar el pack fundador por correo.
          EOF

      - name: Commit commercial configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/herramientas/control-gastronomico-express.tsx docs/cge-checkout-config.md
          git commit -m "feat(cge): preparar checkout seguro y pack fundador [skip ci]"
          git push origin HEAD:release/checkout-ready
