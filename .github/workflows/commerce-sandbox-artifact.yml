name: Commerce Sandbox Artifact

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/pages/api/commerce/**'
      - 'src/pages/checkout/**'
      - 'src/lib/commerce/**'
      - 'src/lib/control-plane/**'
      - 'next.config.js'
      - '.github/workflows/commerce-sandbox-artifact.yml'

permissions:
  contents: read

jobs:
  productionlike-sandbox:
    runs-on: ubuntu-latest
    env:
      JOINHOOK_DEPLOY_TARGET: production
      NEXT_PUBLIC_CONTROL_EXPRESS_CHECKOUT_ENABLED: 'true'
      NEXT_PUBLIC_CONTROL_EXPRESS_CHECKOUT_URL: 'https://mpago.li/1ZUHT1R'
      # Embedded Commerce is deliberately not enabled at build time. The new
      # runtime public-config endpoint reads the cPanel switch after deployment.
      JOINHOOK_COMMERCE_CHECKOUT_ENABLED: 'false'
      JOINHOOK_COMMERCE_ACCEPT_PAYMENTS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit and lint
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
          npx eslint .

      - name: Build production-like Commerce runtime
        env:
          NODE_ENV: production
        run: npm run build

      - name: Start build for route verification
        run: |
          npm run start -- -p 3020 > /tmp/joinhook-commerce-sandbox.log 2>&1 &
          echo $! > /tmp/joinhook-commerce-sandbox.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3020/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/joinhook-commerce-sandbox.log
          exit 1

      - name: Verify production-like routing and safe defaults
        run: |
          curl --fail --silent --show-error --dump-header /tmp/root-headers.txt --output /dev/null http://127.0.0.1:3020/
          if grep -qi '^x-robots-tag:' /tmp/root-headers.txt; then
            echo 'Production-like Commerce artifact must not carry staging noindex headers'
            exit 1
          fi

          curl --location --fail --silent --show-error http://127.0.0.1:3020/herramientas/control-gastronomico-express > /tmp/product.html
          grep -Fq 'https://mpago.li/1ZUHT1R' /tmp/product.html

          # The configured Mercado Pago URL must exist in this artifact. GET is
          # intentionally rejected because the provider uses POST.
          code=$(curl --silent --output /tmp/webhook.txt --write-out '%{http_code}' http://127.0.0.1:3020/api/commerce/mercadopago/webhook)
          test "$code" = '405'

          code=$(curl --silent --output /tmp/webhook-internal.txt --write-out '%{http_code}' http://127.0.0.1:3020/api/commerce/webhooks/mercadopago)
          test "$code" = '405'

          # Server-side payment creation must remain blocked in the artifact QA environment.
          code=$(curl --silent --output /tmp/create-order.json --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data '{}' \
            http://127.0.0.1:3020/api/commerce/create-order)
          test "$code" = '503'
          grep -Fq 'commerce_payments_disabled' /tmp/create-order.json

          curl --fail --silent --show-error http://127.0.0.1:3020/api/commerce/public-config > /tmp/public-config.json
          grep -Fq '"enabled":false' /tmp/public-config.json

      - name: Package BlueHosting runtime and document-root mirror
        run: |
          rm -rf deploy-commerce-sandbox
          mkdir -p deploy-commerce-sandbox/.next
          cp -a .next/standalone/. deploy-commerce-sandbox/
          cp -a .next/static deploy-commerce-sandbox/.next/static
          cp -a public deploy-commerce-sandbox/public

          mkdir -p deploy-commerce-sandbox/document-root-assets/_next
          cp -a .next/static deploy-commerce-sandbox/document-root-assets/_next/static
          cp -a public/. deploy-commerce-sandbox/document-root-assets/

          cat > deploy-commerce-sandbox/DEPLOYMENT.txt <<EOF
          JoinHook Commerce sandbox-capable production-like artifact
          Source commit: $GITHUB_SHA
          Built by: GitHub Actions / Commerce Sandbox Artifact
          Runtime: Node.js 20.20.2
          Runtime destination: /home/joinhook/joinhook-production
          Document root mirror: document-root-assets/ -> /home/joinhook/public_html/
          Startup file: server.js
          External Mercado Pago Link remains the rendered fallback.
          Embedded Commerce is controlled at runtime by cPanel variables.
          Do not run next build on BlueHosting.
          EOF

          test -f deploy-commerce-sandbox/server.js
          test -d deploy-commerce-sandbox/.next/static
          test -d deploy-commerce-sandbox/document-root-assets/_next/static
          diff -qr .next/static deploy-commerce-sandbox/document-root-assets/_next/static
          diff -qr public deploy-commerce-sandbox/document-root-assets --exclude=_next

      - name: Smoke test packaged standalone runtime
        run: |
          PORT=3021 HOSTNAME=127.0.0.1 NODE_ENV=production node deploy-commerce-sandbox/server.js > /tmp/joinhook-commerce-package.log 2>&1 &
          echo $! > /tmp/joinhook-commerce-package.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3021/ > /dev/null; then
              break
            fi
            if [ "$i" = 30 ]; then
              cat /tmp/joinhook-commerce-package.log
              exit 1
            fi
            sleep 1
          done
          code=$(curl --silent --output /tmp/package-webhook.txt --write-out '%{http_code}' http://127.0.0.1:3021/api/commerce/mercadopago/webhook)
          test "$code" = '405'

      - name: Stop QA servers
        if: always()
        run: |
          if [ -f /tmp/joinhook-commerce-sandbox.pid ]; then kill "$(cat /tmp/joinhook-commerce-sandbox.pid)" || true; fi
          if [ -f /tmp/joinhook-commerce-package.pid ]; then kill "$(cat /tmp/joinhook-commerce-package.pid)" || true; fi

      - name: Upload Commerce sandbox artifact
        uses: actions/upload-artifact@v4
        with:
          name: joinhook-commerce-sandbox-productionlike
          path: deploy-commerce-sandbox
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
